spring.application.name=jobrunr-demo
server.address=127.0.0.1

# Lowercase identifiers avoid JobRunr 5.x metadata casing issues on Turkish locales.
spring.datasource.url=jdbc:h2:file:./data/jobrunr;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

org.jobrunr.background-job-server.enabled=true
org.jobrunr.background-job-server.worker-count=2
org.jobrunr.background-job-server.poll-interval-in-seconds=5
org.jobrunr.dashboard.enabled=true
org.jobrunr.dashboard.port=8000
org.jobrunr.dashboard.username=demo
org.jobrunr.dashboard.password=demo
org.jobrunr.miscellaneous.allow-anonymous-data-usage=false
